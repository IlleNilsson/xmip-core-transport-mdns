# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-mdns"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-mdns"
description = "mDNS transport: multicast DNS with DNS-SD over UDP — service announcements and query answers arrive as Streams of their TXT records, a Send Location announces a service. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# mDNS is a DNS message with two bits repurposed (RFC 6762 section 18): the
# message codec is the dns technology's, and only the size mDNS sends is
# this crate's.
dns = { package = "xmip-core-transport-dns", git = "https://github.com/IlleNilsson/xmip-core-transport-dns", branch = "main" }
# The estate's encoding primitives: a TXT string's bytes spelled in hex.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
